<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>telegram-hook mock</title>
<!-- Mock chat for README screenshots. Views: #question #permission #plan #stop #answered #hero.
     Text and buttons come from messages.js (the plugin's builders); regenerate with render.sh. -->
<style>
  * { box-sizing: border-box; }
  html { background: #cfdcc0; }
  body { margin: 0; font: 15px/1.38 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #000; }
  #root { display: flex; gap: 24px; align-items: flex-start; padding: 0 0 0; }
  .phone { flex: 1; min-width: 0; background: linear-gradient(160deg, #d6e3c5, #c3d4b2); }
  .bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: #fff; border-bottom: 1px solid #d8d8d8; }
  .avatar { width: 38px; height: 38px; border-radius: 50%; background: #6f8fae; color: #fff; font-weight: 600; font-size: 15px;
            display: flex; align-items: center; justify-content: center; }
  .name { font-weight: 600; font-size: 16px; }
  .sub { color: #8a8a8a; font-size: 13px; }
  .chat { padding: 14px 12px 10px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 92%; }
  .bubble { position: relative; background: #fff; border-radius: 14px 14px 14px 4px; padding: 8px 12px 6px; box-shadow: 0 1px 1px rgba(0,0,0,.12); overflow-wrap: anywhere; }
  .out { align-self: flex-end; }
  .out .bubble { background: #e2f8c9; border-radius: 14px 14px 4px 14px; }
  .time { float: right; margin: 6px 0 -2px 10px; font-size: 12px; color: #8a9a8a; }
  .out .time { color: #5fa04e; }
  .quote { border-left: 3px solid #5fa04e; background: rgba(95,160,78,.1); border-radius: 4px; padding: 3px 8px; margin-bottom: 4px; font-size: 14px; }
  .quote b { color: #4a8a3a; display: block; font-size: 13px; }
  .keyboard { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
  .keyboard div { background: rgba(80,105,70,.42); color: #fff; font-weight: 500; text-align: center; padding: 9px 8px; border-radius: 8px; font-size: 14.5px; }
  .reaction { display: inline-block; margin-top: 4px; background: #e8f0fb; color: #3a6ea5; border-radius: 12px; padding: 1px 8px; font-size: 14px; }
  .caption { padding: 6px 12px 8px; font-size: 11.5px; color: #4b5a44; text-align: center; }
  .bubble h2 { font-size: 17px; margin: 6px 0 4px; }
  .bubble h3 { font-size: 16px; margin: 2px 0 4px; }
  .bubble p { margin: 4px 0; }
  .bubble hr { border: 0; border-top: 1px solid #dcdcdc; margin: 8px 0; }
  .bubble ul, .bubble ol { margin: 4px 0; padding-left: 22px; }
  .bubble ul.task { list-style: none; padding-left: 2px; }
  .bubble ul.task li::before { content: ""; display: inline-block; width: 13px; height: 13px; border: 1.5px solid #8a8a8a; border-radius: 3px; margin-right: 7px; vertical-align: -2px; }
  .bubble code { font: 13px/1.3 ui-monospace, Menlo, monospace; background: #f1f1f1; border-radius: 4px; padding: 1px 4px; }
  .bubble pre { background: #f1f1f1; border-radius: 6px; padding: 6px 8px; font-size: 13px; }
  .bubble details summary { color: #3a6ea5; cursor: default; }
  .bubble a { color: #3a6ea5; text-decoration: none; }
</style>
</head>
<body>
<div id="root"></div>
<script src="messages.js"></script>
<script>
const M = window.MESSAGES;
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

function inline(s) {
  const keep = [];
  const hold = html => `\u0000${keep.push(html) - 1}\u0000`;
  s = s.replace(/`([^`]+)`/g, (_, c) => hold(`<code>${esc(c)}</code>`));
  s = s.replace(/\\([\\`*_\[\]#~>|])/g, (_, c) => hold(esc(c)));  // md() escapes: show the character
  s = esc(s);
  s = s.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|\W)_(.+?)_(?=\W|$)/g, "$1<i>$2</i>");
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => keep[i]);
}

// Markdown as a Telegram rich message plausibly renders it: CommonMark-like, <details> shown collapsed.
function markdown(text) {
  const out = [], lines = text.split("\n");
  let para = [], list = null;
  const flush = () => {
    if (para.length) out.push("<p>" + para.map((l, i) => i < para.length - 1 && l.endsWith("\\")
      ? inline(l.slice(0, -1)) + "<br>" : inline(l) + " ").join("") + "</p>");
    para = [];
    if (list) { out.push(`<${list.tag}${list.cls}>${list.items.join("")}</${list.tag}>`); list = null; }
  };
  const item = (tag, cls, html) => {
    if (para.length) { const l = list; list = null; flush(); list = l; }
    if (!list || list.tag !== tag || list.cls !== cls) { flush(); list = { tag, cls, items: [] }; }
    list.items.push(`<li>${html}</li>`);
  };
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    let m;
    if (!l.trim()) { flush(); continue; }
    if (l.startsWith("<details>")) {
      flush();
      const summary = (l.match(/<summary>(.*?)<\/summary>/) || [, "Details"])[1];
      while (i < lines.length && !lines[i].includes("</details>")) i++;
      out.push(`<details><summary>${esc(summary)}</summary></details>`);
    } else if (l.startsWith("```")) {
      flush();
      const code = [];
      while (++i < lines.length && !lines[i].startsWith("```")) code.push(lines[i]);
      out.push(`<pre>${esc(code.join("\n"))}</pre>`);
    } else if ((m = l.match(/^(#{2,3}) (.*)/))) { flush(); out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); }
    else if (/^---\s*$/.test(l)) { flush(); out.push("<hr>"); }
    else if ((m = l.match(/^- \[ \] (.*)/))) item("ul", ' class="task"', inline(m[1]));
    else if ((m = l.match(/^- (.*)/))) item("ul", "", inline(m[1]));
    else if ((m = l.match(/^\d+\. (.*)/))) item("ol", "", inline(m[1]));
    else { if (list) flush(); para.push(l); }
  }
  flush();
  return out.join("");
}

const CAPTION = "Illustration: mock rendering of the plugin's messages with sample data, not a real Telegram capture.";

function bot(view, { keyboard = true, reacted = false } = {}) {
  const v = M[view];
  return `<div class="msg"><div class="bubble">${markdown(v.text)}<span class="time">14:32</span>` +
    `<div style="clear:both"></div>${reacted ? '<span class="reaction">\u{1F44D} 1</span>' : ""}</div>` +
    (keyboard ? `<div class="keyboard">${v.buttons.map(b => `<div>${esc(b)}</div>`).join("")}</div>` : "") + "</div>";
}

function phone(body, caption = true) {
  return `<div class="phone"><div class="bar"><div class="avatar">HD</div><div><div class="name">Hook Demo Bot</div>` +
    `<div class="sub">bot</div></div></div><div class="chat">${body}</div>${caption ? `<div class="caption">${CAPTION}</div>` : ""}</div>`;
}

const reply = `<div class="msg out"><div class="bubble"><div class="quote"><b>Hook Demo Bot</b>Claude is waiting for you Prepare the 2.4 release Terminal…</div>` +
  `Wait for review, then deploy to staging.<span class="time">14:41</span><div style="clear:both"></div></div></div>`;

const view = location.hash.slice(1) || "question";
const root = document.getElementById("root");
if (view === "hero") {
  root.style.padding = "24px";
  root.innerHTML = phone(bot("permission"), false) + phone(bot("question"), false);
  root.insertAdjacentHTML("afterend", `<div class="caption" style="padding:0 24px 16px">${CAPTION}</div>`);
} else if (view === "answered") {
  root.innerHTML = phone(bot("stop", { keyboard: false, reacted: true }) + reply);
} else {
  root.innerHTML = phone(bot(view));
}
document.body.dataset.height = Math.ceil(document.body.getBoundingClientRect().height);
</script>
</body>
</html>
